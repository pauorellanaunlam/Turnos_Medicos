<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesion</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <section>
            <h2>Bienvenido a medicos online</h2>

            <div class="login-container">
                <h3>Iniciar sesión</h3>
                <div>
                    <p>Acceso rápido</p>
                    <div>
                        <a href="usuario.html"><button>Usuario</button></a>
                        <a href="admin.html"><button>Administrador</button></a>
                    </div>

                </div>
                <form action="usuario.html" method="get">
                    <label for="username">Numero de documento:</label>
                    <input type="number" id="username" name="username" required>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit">Iniciar sesión</button>
                </form>
            </div>

            <div>
                <button>Registrarse</button>
                <button>Olvidé mi contraseña</button>
            </div>

        </section>
    </main>

</body>

</html>
